<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #root { position: relative; width: 100%; height: 100%; }
      /* Emplacement face cam (remplacé par la vidéo du coach) */
      #facecam { position: absolute; left: 0; top: 0; width: 1080px; height: 860px;
        object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42.8"
         data-width="1080" data-height="1920">
      <video id="facecam" class="clip" src="assets/facecam.mp4" data-start="0" data-duration="42.8" data-track-index="0" data-has-audio="true" playsinline></video>
      <div id="carte" data-composition-id="carte" data-composition-src="compositions/carte.html"
           data-start="0" data-duration="42.8" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="sous-titres" data-composition-id="sous-titres" data-composition-src="compositions/sous-titres.html"
           data-start="0" data-duration="42.8" data-track-index="2" data-track-kind="captions"
           data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
