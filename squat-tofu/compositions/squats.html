  <script>
    (function () {
      var G = 1090, SHIN = 120, THIGH = 125, TORSO = 150, NECK = 16, HEAD = 31, UA = 82, FA = 78;
      var P = { d: 0, lift: 0, mode: "classic", show: 1, arm: 0 };
      var MODES = {
        classic: { ax: 560, hip: [-95, 140], lean: 38, arm: 82, hl: ["thigh", "glute"] },
        bad:     { ax: 560, hip: [-60, 120], lean: 55, arm: 30, hl: [], heel: 1 },
        sumo:    { ax: 560, hip: [-55, 148], lean: 16, arm: 70, hl: ["thigh", "glute"] },
        narrow:  { ax: 560, hip: [-60, 120], lean: 26, arm: 85, hl: ["thigh", "shin"] },
        bulgare: { ax: 615, hip: [-10, 115], lean: 12, arm: 65, hl: ["glute", "thigh"], rear: [425, 992], stand: [525, 862] },
        jump:    { ax: 560, hip: [-95, 140], lean: 38, arm: 82, hl: ["thigh", "glute"] }
      };
      function $(id) { return document.getElementById(id); }
      function ik(h, a, l1, l2, dir) {
        var dx = a[0] - h[0], dy = a[1] - h[1], dd = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01);
        var base = Math.atan2(dy, dx), c = (l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd);
        var ang = Math.acos(Math.max(-1, Math.min(1, c)));
        return [h[0] + l1 * Math.cos(base - dir * ang), h[1] + l1 * Math.sin(base - dir * ang)];
      }
      function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
      function setLine(el, p, q) { el.setAttribute("x1", p[0]); el.setAttribute("y1", p[1]); el.setAttribute("x2", q[0]); el.setAttribute("y2", q[1]); }
      function render() {
        var m = MODES[P.mode], d = P.d, up = -P.lift;
        var ank = [m.ax, G - 6 + up];
        var hip = m.stand ? [m.stand[0] + m.hip[0] * d, m.stand[1] + m.hip[1] * d + up]
                          : [m.ax - 5 + m.hip[0] * d, G - SHIN - THIGH + 6 + m.hip[1] * d + up];
        if (m.heel) ank = [m.ax + 10 * d, G - 6 - 26 * d];
        var knee = ik(hip, ank, THIGH, SHIN, 1.0);
        var heel = m.heel ? [ank[0] - 10, ank[1] + 2] : [ank[0] - 14, ank[1] + 4];
        var toe = [m.ax + 46 + (m.heel ? 4 * d : 0), G - 2 + up];
        var leg = [hip, knee, ank, heel, toe];
        var far;
        if (m.rear) { var rf = [m.rear[0], m.rear[1] + up]; var rk = ik(hip, rf, THIGH, SHIN, 1.0); far = [hip, rk, rf, [rf[0] - 40, rf[1] - 6]]; }
        else far = [[hip[0] - 6, hip[1]], [knee[0] - 8, knee[1] + 2], [ank[0] - 10, ank[1]], [heel[0] - 10, heel[1]], [toe[0] - 10, toe[1]]];
        var lean = m.lean * d * Math.PI / 180;
        var sh = [hip[0] + TORSO * Math.sin(lean), hip[1] - TORSO * Math.cos(lean)];
        var hd = [hip[0] + (TORSO + NECK + HEAD) * Math.sin(lean), hip[1] - (TORSO + NECK + HEAD) * Math.cos(lean)];
        var aa = ((P.mode === "jump" ? P.arm : m.arm * d) + 8) * Math.PI / 180;
        var el = [sh[0] + UA * Math.sin(aa), sh[1] + UA * Math.cos(aa)];
        var bend = 0.25;
        var hn = [el[0] + FA * Math.sin(aa + bend), el[1] + FA * Math.cos(aa + bend)];
        $("leg-near").setAttribute("points", pts(leg));
        $("leg-far").setAttribute("points", pts(far));
        setLine($("torso"), hip, sh);
        $("head").setAttribute("cx", hd[0]); $("head").setAttribute("cy", hd[1]);
        $("arm-near").setAttribute("points", pts([sh, el, hn]));
        $("arm-far").setAttribute("points", pts([[sh[0] - 6, sh[1] + 2], [el[0] - 8, el[1] + 2], [hn[0] - 8, hn[1] + 2]]));
        setLine($("thigh-hl"), hip, knee); setLine($("shin-hl"), knee, ank);
        var g = $("glute"); g.setAttribute("cx", hip[0] - 22); g.setAttribute("cy", hip[1] + 4);
        var k = 0.25 + 0.75 * d;
        $("thigh-hl").setAttribute("opacity", m.hl.indexOf("thigh") > -1 ? k : 0);
        $("shin-hl").setAttribute("opacity", m.hl.indexOf("shin") > -1 ? k : 0);
        g.setAttribute("opacity", m.hl.indexOf("glute") > -1 ? 0.9 * k : 0);
        var sw = Math.max(0.35, 1 - P.lift / 220);
        $("shadow").setAttribute("rx", 120 * sw); $("shadow").setAttribute("cx", m.ax - 10);
        $("fig").setAttribute("opacity", P.show);
        var b = P.mode === "bulgare" ? 1 : 0;
        ["bench", "bench-l", "bench-r"].forEach(function (id) { $(id).setAttribute("opacity", b); });
      }
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function reps(t0, t1, mode) {
        tl.set(P, { mode: mode, d: 0, lift: 0 }, t0);
        for (var t = t0 + 0.3; t + 1.15 < t1; t += 1.3) {
          tl.to(P, { d: 1, duration: 0.55, ease: "power2.inOut" }, t);
          tl.to(P, { d: 0, duration: 0.5, ease: "power2.inOut" }, t + 0.7);
        }
      }
      function jumps(t0, t1) {
        tl.set(P, { mode: "jump", d: 0, lift: 0, arm: 0 }, t0);
        for (var t = t0 + 0.3; t + 1.3 < t1; t += 1.45) {
          tl.to(P, { d: 1, arm: -35, duration: 0.45, ease: "power2.inOut" }, t);
          tl.to(P, { d: 0, arm: 165, duration: 0.2, ease: "power2.out" }, t + 0.45);
          tl.to(P, { lift: 85, duration: 0.3, ease: "power2.out" }, t + 0.5);
          tl.to(P, { lift: 0, arm: 20, duration: 0.3, ease: "power2.in" }, t + 0.8);
          tl.to(P, { d: 0.45, arm: 60, duration: 0.14, ease: "power2.out" }, t + 1.1);
          tl.to(P, { d: 0, arm: 0, duration: 0.2, ease: "power2.inOut" }, t + 1.24);
        }
      }
      // figure choreography
      reps(0, 2.9, "bad");
      reps(2.9, 6.36, "classic");
      reps(6.36, 10.56, "classic");
      reps(10.56, 16.14, "sumo");
      reps(16.14, 20.14, "narrow");
      reps(20.14, 24.68, "bulgare");
      jumps(24.68, 28.18);
      tl.to(P, { show: 0, duration: 0.15 }, 28.145);

      // hook
      tl.from("#t-hook", { scale: 1.12, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(P, { d: 0.45 }, { d: 1, duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo("#x-g", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.4)" }, 1.5);
      tl.to("#x-g", { rotation: 8, duration: 0.08, yoyo: true, repeat: 3 }, 1.72);
      // intro
      tl.from("#i-a", { scale: 0.4, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 2.95);
      tl.from("#i-b", { y: 60, opacity: 0, duration: 0.25, ease: "power3.out" }, 3.4);
      // variant titles + chips
      [[1, 6.36], [2, 10.56], [3, 16.14], [4, 20.14], [5, 24.68]].forEach(function (v) {
        tl.from("#t-" + v[0], { x: -120, opacity: 0, duration: 0.25, ease: "power3.out" }, v[1] + 0.02);
        tl.from("#c-" + v[0] + " .chip", { y: 40, opacity: 0, duration: 0.22, stagger: 0.1, ease: "back.out(2)" }, v[1] + 0.25);
      });
      // stance inset: centre 220,725 ; [gap, toe-out deg]
      function feet(t, gap, ang, first) {
        var o = { duration: first ? 0 : 0.3, ease: "power3.inOut" };
        tl.to("#foot-l", Object.assign({ x: 220 - gap / 2 - 17, y: 687, rotation: -ang, transformOrigin: "50% 50%" }, o), t);
        tl.to("#foot-r", Object.assign({ x: 220 + gap / 2 - 17, y: 687, rotation: ang, transformOrigin: "50% 50%" }, o), t);
      }
      feet(6.36, 100, 8, true); feet(10.56, 170, 32); feet(16.14, 42, 0.0);
      tl.from("#inset-g", { opacity: 0, x: -40, duration: 0.25 }, 6.41);
      // heart
      for (var h = 24.78; h < 28.03; h += 0.55) tl.fromTo("#heart-g", { scale: 1 }, { scale: 1.22, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, h);
      // outro
      tl.from("#t-outro", { scale: 1.3, opacity: 0, duration: 0.25, ease: "back.out(2)" }, 28.2);
      tl.from("#grid .row", { x: 160, opacity: 0, duration: 0.25, stagger: 0.12, ease: "power3.out" }, 28.53);
      tl.to("#grid .row", { borderColor: "#c8ff2e", duration: 0.12, stagger: 0.25, yoyo: true, repeat: 1 }, 30.13);
      // flashes on cuts
      [2.9, 6.36, 10.56, 16.14, 20.14, 24.68, 28.18].forEach(function (c) {
        tl.fromTo("#flash", { opacity: 0.35 }, { opacity: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, c);
      });
      tl.from("#save span", { scale: 0.6, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 29.78);
      tl.set(P, { show: 1, mode: "bad", d: 0, lift: 0 }, 34.95);
      tl.set({}, {}, 35.35);
      render();
      window.__timelines["squats"] = tl;
    })();
  </script>
